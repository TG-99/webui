<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3X-UI - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0c1220;
            --card-bg: #141b2d;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #1677ff;
            --primary-hover: #388bff;
            --primary-active: #0958d9;
            --input-bg: #1a2235;
            --input-border: #28344c;
            --input-border-focus: #1677ff;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-placeholder: #57657e;
            --error-color: #ff4d4f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(22, 119, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 44px 38px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(22, 119, 255, 0.08);
            position: relative;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
            display: block;
        }

        .brand-underline {
            width: 38px;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
            margin: 8px auto 18px;
            box-shadow: 0 0 10px rgba(22, 119, 255, 0.5);
        }

        .welcome-title {
            font-size: 1.9rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .error-alert {
            background: rgba(255, 77, 79, 0.12);
            border: 1px solid rgba(255, 77, 79, 0.3);
            color: #ff7875;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #d1d9e6;
            font-size: 0.92rem;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 13px 14px 13px 40px;
            border-radius: 9px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control::placeholder {
            color: var(--text-placeholder);
        }

        .form-control:focus {
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.18);
            background: #1d273d;
        }

        .form-control:focus ~ .input-icon {
            color: var(--primary);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(22, 119, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(22, 119, 255, 0.5);
            transform: translateY(-1px);
        }

        .btn-login:active {
            background: var(--primary-active);
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-header">
            <span class="brand-title">3X-UI</span>
            <div class="brand-underline"></div>
            <h1 class="welcome-title">Welcome</h1>
        </div>

        {% if error %}
        <div class="error-alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>
                    <i class="fa-regular fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                    <i class="fa-solid fa-lock input-icon"></i>
                    <button type="button" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye-slash" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span>Log In</span>
            </button>
        </form>

        <div class="login-footer">
            <span>SSH &amp; WebSocket Proxy Management</span>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
